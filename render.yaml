services:
  # Backend API
  - type: web
    name: advanced-rag-backend
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/advanced-rag
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_db
      - key: LLM_MODEL
        value: meta-llama/llama-3.1-8b-instruct
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
    disk:
      name: chroma-data
      mountPath: /app/chroma_db
      sizeGB: 1

  # Frontend
  - type: static
    name: advanced-rag-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://advanced-rag-backend.onrender.com

databases:
  - name: rag-db
    databaseName: ragdb
    user: raguser
    plan: free